<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冲突战模拟器</title>
<style>
:root{--bg:#0f1117;--s:#1a1d27;--s2:#22263a;--b:#2a2d38;--t:#e1e4ed;--t2:#b0b5c6;--m:#6b7094;--cog:#4fc3f7;--emo:#ef5350;--beh:#66bb6a;--san:#7e57c2;--hp:#ef5350;--pl:#42a5f5;--en:#ff7043}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;min-height:100vh;padding:10px;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 14px;background:var(--s);border-radius:8px;border:1px solid var(--b)}
h1{font-size:1rem}.btn{padding:5px 12px;border-radius:5px;border:1px solid var(--b);background:var(--s2);color:var(--t);cursor:pointer;font-size:0.74rem;font-family:inherit}.btn:hover{background:#2e3350}.btn.primary{background:#3d5af1;border-color:#3d5af1;color:#fff}.btn.sm{padding:3px 7px;font-size:0.66rem}
main{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--s);border-radius:8px;border:1px solid var(--b);padding:10px;display:flex;flex-direction:column;gap:6px}
.panel.pl{border-top:3px solid var(--pl)}.panel.en{border-top:3px solid var(--en)}
h2{font-size:0.82rem}.bar{display:flex;align-items:center;gap:4px;font-size:0.68rem}
.bar .lb{width:24px;font-weight:600}.bar .bw{flex:1;height:10px;background:#11131c;border-radius:5px;overflow:hidden}
.bar .bf{height:100%;border-radius:5px;transition:width 0.4s}.bf.san{background:linear-gradient(90deg,#5c3d99,#7e57c2)}.bf.hp{background:linear-gradient(90deg,#c62828,#ef5350)}
.bar .val{width:48px;text-align:right;font-family:monospace;font-size:0.66rem}
.pad{display:flex;gap:3px;justify-content:center;font-size:0.66rem;font-family:monospace;padding:4px;background:#11131c;border-radius:4px}
.pad .pi{flex:1;text-align:center;padding:2px 4px;border-radius:3px}.pad .pl{color:var(--m);font-size:0.56rem}.pad .pv{font-weight:700;font-size:0.76rem}
.slots{display:flex;gap:5px}
.slot{flex:1;min-width:75px;min-height:80px;background:var(--s2);border:2px dashed var(--b);border-radius:6px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all 0.1s}
.slot:hover{border-color:var(--m)}.slot.set{border-style:solid}.slot.sc{border-color:rgba(79,195,247,0.3)}.slot.se{border-color:rgba(239,83,80,0.3)}.slot.sb{border-color:rgba(102,187,138,0.3)}
.slot.set.sc{background:rgba(79,195,247,0.05);border-color:var(--cog)}.slot.set.se{background:rgba(239,83,80,0.05);border-color:var(--emo)}.slot.set.sb{background:rgba(102,187,138,0.05);border-color:var(--beh)}
.slot .lb{font-size:0.6rem;color:var(--m)}.slot .mt{font-size:0.58rem;color:var(--m)}
.slot .cn{font-size:0.72rem;font-weight:600;text-align:center}.slot .cv{font-size:0.54rem;color:var(--t2);font-family:monospace}
.bottom{background:var(--s);border-radius:8px;border:1px solid var(--b);padding:10px}
.tabs{display:flex;gap:2px;margin-bottom:6px}.tab{padding:3px 10px;border-radius:4px 4px 0 0;background:var(--s2);color:var(--m);cursor:pointer;font-size:0.68rem}.tab.on{background:var(--s);color:var(--t);border:1px solid var(--b);border-bottom:none}
.tc{display:none}.tc.on{display:block}
.grid{display:flex;flex-wrap:wrap;gap:5px;max-height:200px;overflow-y:auto}
.card{width:105px;padding:6px 8px;background:var(--s2);border:1px solid var(--b);border-radius:4px;cursor:pointer;font-size:0.66rem;transition:all 0.1s;display:flex;flex-direction:column;gap:1px}
.card:hover{border-color:var(--m)}.card.sel{border-color:#ffd54f;box-shadow:0 0 5px rgba(255,213,79,0.2)}
.card .cn{font-weight:600}.card .ct{font-size:0.56rem;color:var(--m)}.card .cv{font-size:0.54rem;font-family:monospace;color:var(--t2)}
.card.cog{border-left:2px solid var(--cog)}.card.emo{border-left:2px solid var(--emo)}.card.beh{border-left:2px solid var(--beh)}
.log{max-height:160px;overflow-y:auto;font-size:0.64rem;font-family:monospace}
.log .l{padding:1px 4px;border-radius:2px}.log .lr{color:#ffd54f;font-weight:600}.log .lp{background:rgba(66,165,245,0.05)}.log .le{background:rgba(255,112,67,0.05)}.log .lw{color:#66bb6a}.log .ll{color:var(--hp)}.log .li{color:var(--m);font-style:italic}
.edit{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;font-size:0.66rem}
.edit input{width:60px;padding:3px 5px;border-radius:3px;border:1px solid var(--b);background:var(--s2);color:var(--t);font-family:monospace;font-size:0.65rem;text-align:center}
.edit select{padding:3px 5px;border-radius:3px;border:1px solid var(--b);background:var(--s2);color:var(--t);font-size:0.65rem}
.edit label{color:var(--m);margin-left:6px}
@keyframes fw{50%{box-shadow:0 0 14px rgba(102,187,138,0.35)}}@keyframes fl{50%{box-shadow:0 0 14px rgba(239,83,80,0.35)}}.rw{animation:fw 0.5s}.rl{animation:fl 0.5s}
</style>
</head>
<body>

<header>
  <div><h1>⚔️ 冲突战模拟器</h1><div style="font-size:0.6rem;color:var(--m)">PAD加权 → 态度碰撞 → SAN/HP结算 &nbsp;|&nbsp; 空格=结算 1-3=角色 4-6=敌方</div></div>
  <div style="display:flex;gap:5px;flex-wrap:wrap">
    <button class="btn primary" onclick="round()">结算</button>
    <button class="btn" onclick="autoN(5)">×5</button>
    <button class="btn" onclick="reset()">重置</button>
    <button class="btn sm" onclick="pre('fear')">恐惧</button>
    <button class="btn sm" onclick="pre('argue')">争论</button>
    <button class="btn sm" onclick="pre('grief')">悲痛</button>
    <button class="btn sm" onclick="rnd()">随机</button>
  </div>
</header>

<main>
  <div class="panel pl" id="pp">
    <h2>角色</h2>
    <div class="bar"><span class="lb" style="color:var(--san)">SAN</span><div class="bw"><div class="bf san" id="psb" style="width:100%"></div></div><span class="val" id="psv">100/100</span></div>
    <div class="bar"><span class="lb" style="color:var(--hp)">HP</span><div class="bw"><div class="bf hp" id="phb" style="width:100%"></div></div><span class="val" id="phv">100/100</span></div>
    <div class="pad" id="ppd"></div>
    <div class="slots" id="ps"></div>
  </div>
  <div class="panel en" id="ep">
    <h2>敌方</h2>
    <div class="bar"><span class="lb" style="color:var(--san)">SAN</span><div class="bw"><div class="bf san" id="esb" style="width:100%"></div></div><span class="val" id="esv">100/100</span></div>
    <div class="bar"><span class="lb" style="color:var(--hp)">HP</span><div class="bw"><div class="bf hp" id="ehb" style="width:100%"></div></div><span class="val" id="ehv">100/100</span></div>
    <div class="pad" id="epd"></div>
    <div class="slots" id="es"></div>
  </div>
</main>

<div class="bottom">
  <div class="tabs">
    <div class="tab on" onclick="st('lib')">卡牌库</div>
    <div class="tab" onclick="st('log')">日志</div>
    <div class="tab" onclick="st('edit')">快捷编辑</div>
  </div>
  <div class="tc on" id="t-lib">
    <div style="font-size:0.6rem;color:var(--m);margin-bottom:3px">点卡牌选中 → 点卡槽放入 &nbsp;|&nbsp; 认知→槽1 &nbsp; 情绪→槽2 &nbsp; 行为→槽3</div>
    <div class="grid" id="cg"></div>
  </div>
  <div class="tc" id="t-log"><div class="log" id="bl"></div></div>
  <div class="tc" id="t-edit">
    <div class="edit">
      快速添加卡牌:
      <select id="ecat"><option>认知</option><option>情绪</option><option>行为</option></select>
      <input id="enm" placeholder="名称">
      &nbsp;V:<input id="ev" value="0" type="number" step="0.1" min="-1" max="1">
      A:<input id="ea" value="0" type="number" step="0.1" min="-1" max="1">
      D:<input id="ed" value="0" type="number" step="0.1" min="-1" max="1">
      <button class="btn sm primary" onclick="add()">+ 添加</button>
    </div>
  </div>
</div>

<script>
// Data
const ED={
  '恐惧':[-0.854,0.680,-0.414],'愤怒':[-0.666,0.730,0.314],'焦虑':[-0.708,0.730,-0.316],
  '厌恶':[-0.896,0.550,-0.366],'恐怖':[-0.770,0.700,-0.124],'绝望':[-0.770,0.588,-0.510],
  '内疚':[-0.584,0.134,-0.588],'悲痛':[-0.896,-0.424,-0.672],'孤独':[-0.500,-0.548,-0.524],
  '快乐':[0.960,0.648,0.588],'爱':[1.000,0.038,0.346],'共情':[0.458,-0.302,0.090],
  '平静':[0.600,-0.756,0.114],'希望':[0.854,-0.366,0.478],'敬畏':[-0.062,0.480,-0.400]
};

let L=[],S={p:{san:100,ms:100,hp:100,mh:100,pad:[0,0,0],sl:[null,null,null]},e:{san:100,ms:100,hp:100,mh:100,pad:[0,0,0],sl:[null,null,null]},r:0,sel:null};

function build(){
  let a=[];
  for(let[k,v]of Object.entries(ED)) a.push({id:'e_'+k,n:k,cat:'情绪',sub:k,pad:[...v]});
  let cg=[{n:'知觉锐化',s:'知觉与注意',pad:[0.2,0.4,0.3]},{n:'注意转移',s:'知觉与注意',pad:[0,-0.5,0.1]},{n:'记忆检索',s:'记忆',pad:[0,0.3,-0.1]},{n:'创伤闪回',s:'记忆',pad:[-0.6,0.6,-0.5]},{n:'概念归类',s:'知识表征',pad:[0.1,-0.2,0.3]},{n:'刻板印象',s:'知识表征',pad:[-0.2,-0.3,0.1]},{n:'语言重述',s:'表象与语言',pad:[0.3,-0.3,0.4]},{n:'内心独白',s:'表象与语言',pad:[0.1,0.2,0.2]},{n:'后果推演',s:'推理与决策',pad:[-0.1,0.1,0.4]},{n:'灾难推演',s:'推理与决策',pad:[-0.5,0.5,-0.4]}];
  cg.forEach(c=>a.push({id:'c_'+c.n,n:c.n,cat:'认知',sub:c.s,pad:c.pad}));
  let bh=[{n:'僵住',d:'反射',pad:[0,0,-0.6]},{n:'逃跑',d:'反射',pad:[-0.3,0.2,-0.4]},{n:'回避',d:'惩罚',pad:[-0.2,0.1,-0.2]},{n:'妥协',d:'惩罚',pad:[0,-0.2,-0.3]},{n:'趋近',d:'奖励',pad:[0.3,0.3,0.3]},{n:'坚持',d:'奖励',pad:[0.2,0.4,0.4]},{n:'坚守',d:'道德',pad:[0,-0.1,0.5]},{n:'纠正',d:'道德',pad:[-0.1,0.3,0.5]},{n:'遵从',d:'文化',pad:[0,-0.3,0]},{n:'礼仪',d:'文化',pad:[0.1,-0.4,0.1]},{n:'牺牲',d:'价值',pad:[0.1,0.1,0.8]},{n:'超越',d:'价值',pad:[0.3,0.2,0.7]},{n:'安抚',d:'照护',pad:[0.4,-0.3,0.2]},{n:'保护',d:'照护',pad:[0.3,0.2,0.4]}];
  bh.forEach(c=>a.push({id:'b_'+c.n,n:c.n,cat:'行为',sub:c.d,pad:c.pad,dr:c.d}));
  return a;
}
L=build();
try{let s=localStorage.getItem('mcl');if(s){let d=JSON.parse(s);if(Array.isArray(d))L=d;}}catch(e){}

// Render
function ra(){rs('p');rs('e');rpd('p');rpd('e');rb('p');rb('e');rc();}
function rc(){
  document.getElementById('cg').innerHTML=L.map(c=>{
    let s=S.sel&&S.sel.id===c.id?'sel':'',cls=c.cat==='认知'?'cog':c.cat==='情绪'?'emo':'beh';
    return `<div class="card ${cls} ${s}" onclick="sel('${c.id}')" ondblclick="del('${c.id}')" title="双击删除">
      <div class="cn">${c.n}</div><div class="ct">${c.cat}·${c.sub||c.dr||''}</div>
      <div class="cv">V${c.pad[0].toFixed(1)} A${c.pad[1].toFixed(1)} D${c.pad[2].toFixed(1)}</div>
    </div>`;
  }).join('');
}
function rs(s){
  let c=S[s],co=document.getElementById(s==='p'?'ps':'es'),cats=['认知','情绪','行为'],cls=['sc','se','sb'];
  co.innerHTML=cats.map((t,i)=>{
    let x=c.sl[i];
    if(x)return `<div class="slot set ${cls[i]}" onclick="clr('${s}',${i})"><div class="cn">${x.n}</div><div class="cv">V${x.pad[0].toFixed(1)} A${x.pad[1].toFixed(1)} D${x.pad[2].toFixed(1)}</div></div>`;
    return `<div class="slot ${cls[i]}" onclick="asn('${s}',${i})"><span class="lb">${t}</span><span class="mt">点击选牌</span></div>`;
  }).join('');
}
function rpd(s){
  let c=S[s],el=document.getElementById(s==='p'?'ppd':'epd'),p=c.pad;
  el.innerHTML='VAD'.split('').map((l,i)=>`<div class="pi"><div class="pl">${l}</div><div class="pv" style="color:${i===0?(p[0]>0?'#66bb6a':p[0]<0?'#ef5350':'#b0b5c6'):i===2?(p[2]>0?'#66bb6a':p[2]<0?'#ef5350':'#b0b5c6'):'#ffd54f'}">${p[i].toFixed(2)}</div></div>`).join('');
}
function rb(s){
  let c=S[s],pre=s==='p'?'p':'e';
  document.getElementById(pre+'sb').style.width=(c.san/c.ms*100)+'%';
  document.getElementById(pre+'sv').textContent=c.san+'/'+c.ms;
  document.getElementById(pre+'hb').style.width=(c.hp/c.mh*100)+'%';
  document.getElementById(pre+'hv').textContent=c.hp+'/'+c.mh;
}

// Actions
function sel(id){S.sel=L.find(c=>c.id===id);rc();}
function asn(s,i){
  if(!S.sel)return log('先选一张卡牌','i');
  let cats=['认知','情绪','行为'];
  if(S.sel.cat!==cats[i])return log('类别不匹配: 需要【'+cats[i]+'】','i');
  S[s].sl[i]={...S.sel};S.sel=null;ra();
}
function clr(s,i){S[s].sl[i]=null;ra();}
function del(id){L=L.filter(c=>c.id!==id);if(S.sel&&S.sel.id===id)S.sel=null;['p','e'].forEach(s=>S[s].sl=S[s].sl.map(x=>x&&x.id===id?null:x));localStorage.setItem('mcl',JSON.stringify(L));ra();}
function add(){
  let n=document.getElementById('enm').value.trim();if(!n)return;
  let cat=document.getElementById('ecat').value;
  let pad=[parseFloat(document.getElementById('ev').value)||0,parseFloat(document.getElementById('ea').value)||0,parseFloat(document.getElementById('ed').value)||0];
  L.push({id:'u_'+Date.now(),n:n,cat:cat,sub:'自定义',pad:pad});
  localStorage.setItem('mcl',JSON.stringify(L));ra();document.getElementById('enm').value='';
}

// Battle
function att(c){let ps=c.sl.filter(x=>x).map(x=>x.pad);if(ps.length===0)return[0,0,0];return[ps.reduce((s,v)=>s+v[0],0)/ps.length,ps.reduce((s,v)=>s+v[1],0)/ps.length,ps.reduce((s,v)=>s+v[2],0)/ps.length];}
function mg(v){return Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);}

function round(){
  S.r++;log('━━━ 第 '+S.r+' 回合 ━━━','lr');
  let pa=att(S.p),ea=att(S.e);S.p.pad=pa;S.e.pad=ea;
  log('角色 PAD: V'+pa[0].toFixed(2)+' A'+pa[1].toFixed(2)+' D'+pa[2].toFixed(2),'lp');
  log('敌方 PAD: V'+ea[0].toFixed(2)+' A'+ea[1].toFixed(2)+' D'+ea[2].toFixed(2),'le');

  let dd=pa[2]-ea[2],pm=mg(pa),em=mg(ea),w=null,sd=0,hd=0;

  if(Math.abs(dd)>0.2){w=dd>0?'p':'e';let m=w==='p'?pm:em;sd=Math.round(5+m*10+Math.abs(dd)*8);hd=Math.round(m*5);log((w==='p'?'角色':'敌方')+'主导 ΔD='+dd.toFixed(2),'li');}
  else if(pm>em+0.1){w='p';sd=Math.round(4+pm*8);hd=Math.round(pm*3);log('角色占上风','li');}
  else if(em>pm+0.1){w='e';sd=Math.round(4+em*8);hd=Math.round(em*3);log('敌方占上风','li');}
  else{w='d';sd=Math.round(3+((pm+em)/2)*5);log('势均力敌','li');}

  if(w==='p'){S.e.san=Math.max(0,S.e.san-sd);S.e.hp=Math.max(0,S.e.hp-hd);log('敌方 SAN-'+sd+' HP-'+hd,'lw');fl('e','l');fl('p','w');}
  else if(w==='e'){S.p.san=Math.max(0,S.p.san-sd);S.p.hp=Math.max(0,S.p.hp-hd);log('角色 SAN-'+sd+' HP-'+hd,'ll');fl('p','l');fl('e','w');}
  else{S.p.san=Math.max(0,S.p.san-sd);S.e.san=Math.max(0,S.e.san-sd);log('双方 SAN-'+sd,'li');}

  ['p','e'].forEach(s=>{if(S[s].san<30&&S[s].hp>0){let b=Math.round((30-S[s].san)*0.2);S[s].hp=Math.max(0,S[s].hp-b);if(b>0)log((s==='p'?'角色':'敌方')+' SAN过低 HP-'+b,'li');}});
  if(S.p.san<=0||S.p.hp<=0)log('💀 角色崩溃','ll');
  if(S.e.san<=0||S.e.hp<=0)log('🏆 敌方崩溃','lw');
  ra();
}
function fl(s,r){let e=document.getElementById(s==='p'?'pp':'ep');e.classList.remove('rw','rl');void e.offsetWidth;e.classList.add(r==='w'?'rw':'rl');setTimeout(()=>e.classList.remove('rw','rl'),500);}

// Log
function log(m,c){S.log.push({m,c});let e=document.getElementById('bl');e.innerHTML+=`<div class="l ${c||''}">${m}</div>`;e.scrollTop=e.scrollHeight;}

// Presets
function f(n){return L.find(c=>c.n===n);}
function c(x){return x?{...x}:null;}
function pre(s){
  reset();
  if(s==='fear'){S.p.sl=[c(f('注意转移')),c(f('平静')),c(f('安抚'))];S.e.sl=[c(f('灾难推演')),c(f('恐惧')),c(f('僵住'))];log('👻 恐惧压制','li');}
  else if(s==='argue'){S.p.sl=[c(f('后果推演')),c(f('愤怒')),c(f('纠正'))];S.e.sl=[c(f('刻板印象')),c(f('厌恶')),c(f('回避'))];log('💬 争论','li');}
  else if(s==='grief'){S.p.sl=[c(f('语言重述')),c(f('共情')),c(f('保护'))];S.e.sl=[c(f('创伤闪回')),c(f('悲痛')),c(f('僵住'))];log('😢 悲痛应对','li');}
  ra();
}
function rnd(){['p','e'].forEach(s=>{S[s].sl=['认知','情绪','行为'].map(c=>{let p=L.filter(x=>x.cat===c);return p.length?{...p[Math.floor(Math.random()*p.length)]}:null;});});log('🎲 随机配牌','li');ra();}
function reset(){S={p:{san:100,ms:100,hp:100,mh:100,pad:[0,0,0],sl:[null,null,null]},e:{san:100,ms:100,hp:100,mh:100,pad:[0,0,0],sl:[null,null,null]},r:0,sel:null,log:[]};document.getElementById('bl').innerHTML='';ra();}
function autoN(n){for(let i=0;i<n;i++){['p','e'].forEach(s=>{S[s].sl=S[s].sl.map((x,j)=>{if(x)return x;let p=L.filter(c=>c.cat===['认知','情绪','行为'][j]);return p.length?{...p[Math.floor(Math.random()*p.length)]}:null;});});round();if(S.p.san<=0||S.p.hp<=0||S.e.san<=0||S.e.hp<=0)break;}ra();}

// Tabs
function st(n){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));document.querySelectorAll('.tc').forEach(t=>t.classList.remove('on'));document.querySelector(`.tab[onclick="st('${n}')"]`).classList.add('on');document.getElementById('t-'+n).classList.add('on');}

// Keyboard
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key===' '||e.key==='Enter'){e.preventDefault();round();}if(e.key==='1')asn('p',0);if(e.key==='2')asn('p',1);if(e.key==='3')asn('p',2);if(e.key==='4')asn('e',0);if(e.key==='5')asn('e',1);if(e.key==='6')asn('e',2);if(e.key==='Escape'){S.sel=null;rc();}if(e.key==='r'&&e.ctrlKey){e.preventDefault();reset();}});

reset();
</script>
