name: CI

# 极简 CI —— 只做构建与测试（2026-09-17，owner 裁定撤销全部门禁）。
#
# 历史：本 workflow 此前有四个 job（docs-integrity / engine / issues-snapshot / unity），
# 其中三个是自建门禁（18 个生产校验器 + fixture 套件 + issue 契约快照）。那些门禁与其
# 脚本、注册表（design/engineering/gates.json）已于 2026-09-17 一并移除。
#
# 现在只剩一件事：**代码能编过、测试能通过**。
# 校验改用人工判断——本 workflow 不通过不代表设计文档或数据契约没有问题。
#
# 2026-09-18 增补：加了一个 **只报不拦** 的 npc-materials-report job（owner 裁定选 B）。
# 它不是门禁的回归——单脚本、只用 stdlib、不建例外表、continue-on-error: true，
# 永远不改红叉，只产出报告 artifact。理由见该 job 上方注释与 code/tools/check_npc_materials.py 头部。

on:
  push:
    branches: ['main', 'refactor/**', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── C# 逻辑引擎 ────────────────────────────────────────────
  engine:
    name: engine (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
          # 工程目标框架是 net8.0；只装 SDK 即可（SDK 10 能编译 net8.0）
      - name: 确认 SDK 版本与 global.json 一致
        run: |
          dotnet --version
          test "$(dotnet --version)" = "10.0.400" || {
            echo "::error::SDK 版本与 global.json 不符"
            exit 1
          }
      - name: restore（验证锁文件可用，不依赖开发机缓存）
        run: dotnet restore code/src/YouAreNotTheFish.sln
      - name: build
        run: dotnet build code/src/YouAreNotTheFish.sln --no-restore -c Release
      # 桥接工程（netstandard2.1）已在上面这次 sln 构建里被编到；本步把它**单独再编一次**是为了：
      # ① 失败时一眼看出是护栏红了，而不是主工程红了；② 把「链接的 3 个 Core 源文件必须能在
      #    netstandard2.1 下编译」这条判据钉在 CI 上（Q6b 裁定 A · ARCHITECTURE §4.1 · #155）。
      - name: 桥接工程构建（netstandard2.1 护栏 · #155）
        run: dotnet build code/src/YouAreNotTheFish.Core.Unity/YouAreNotTheFish.Core.Unity.csproj --no-restore -c Release
      - name: test
        run: |
          dotnet test code/src/YouAreNotTheFish.sln --no-build -c Release \
            --logger "trx;LogFileName=engine.trx" --results-directory artifacts
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-results
          path: artifacts/engine.trx
          if-no-files-found: error

  # ── NPC 素材一致性报告（只报不拦 · 非门禁）────────────────────────────
  # 为什么不是门禁（2026-09-17 owner 撤掉 26 个校验器 + 两张 exceptions 表 + 三个门禁 job）：
  #   ① 那时养不起的是「例外表」与「各文档格式的专用规则」——本 job 两者都没有；
  #   ② 本 job 的判据全是**跨字段一致性**（同一个事实在两个地方必须对得上），零容差、误报率低；
  #   ③ 它**永不失败**：continue-on-error + `|| true` 双保险，红叉都不会给。
  # 判据清单与「为什么旧的被删、为什么这个只报不拦」写在 code/tools/check_npc_materials.py 头部。
  npc-materials-report:
    name: npc-materials-report (只报不拦 · 非门禁)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: NPC 素材一致性报告（永不失败）
        run: |
          python3 code/tools/check_npc_materials.py --json npc-report.json || true
          python3 code/tools/check_npc_materials.py --only json,manifest,ages,bands,crossview || true
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-materials-report
          path: npc-report.json
          if-no-files-found: warn
