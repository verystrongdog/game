name: 实验（Experiment）
description: 玩家体验或技术可行性未知。约束见 design/engineering/issue-process.md §4。
labels: [type:experiment, state:needs-triage]
body:
  - type: dropdown
    id: issue-type
    attributes:
      label: 类型
      description: 本表单只对一种类型开放，保持选中即可。这一项渲染出的 `### 类型` 章节是校验器的解析锚点，使网页通道与 CLI 通道产出的正文结构逐字一致（校验器只认正文，不认标签）。
      options:
        - Experiment
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 这件事解决什么问题、为什么是现在、不做会怎样。有未决问题时不得导入 Task / Implementation，只能走 Experiment 或 RFC（issue-process.md §2.2）。
      placeholder: |
        问题：
        为什么是现在：
        不做会怎样：
    validations:
      required: true

  - type: textarea
    id: capability-delta
    attributes:
      label: 能力增量
      description: markdown 表格，三列：能力 | 轴 | 从 → 到。轴只能取 Design / Implementation / Integration / Health，状态只用 WORKFLOW.md §二 各轴的合法取值；能力名逐字取自 design/slices/<id>/slice.md §二。可行性未知的典型落 Design 轴 `UNRESOLVED` → `CANDIDATE`。≤ 3 行、≤ 4 个单元格（A1 / I12）。
      placeholder: |
        | 能力 | 轴 | 从 → 到 |
        |---|---|---|
        | 探索与接敌 | Design | `UNRESOLVED` → `CANDIDATE` |
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖
      description: "三行 key: value，缺一不可。blocked-by 取已关闭的 `#NN`（逗号分隔）或 `无`；consumed-by 取 `#NN` / `<切片 id>` / `证据:<路径>` / `门禁:<gate id>` / `待建:<描述>` / `终态`；requires 取 `gate:<gate id>` / `PLAYABLE:<状态>` / `能力:<能力名>=<轴>:<状态>` / `owner:<决策项>`，或 `无`。取值域见 issue-process.md §4.1.1，不得自造。"
      placeholder: |
        blocked-by: 无
        consumed-by: 证据:design/engineering/evidence/P4a-2026-09-12.md
        requires: 无
    validations:
      required: true

  - type: textarea
    id: gates
    attributes:
      label: 门禁
      description: "实验的判据是结论而不是机器门禁，无门禁时写 `none`（仅 RFC / Experiment 允许，I12）；但验收标准必须写明谁在何处记录该结论。若有可跑的既有 gate，一行一条地列出，gate id 必须存在于 design/engineering/gates.json（docs-integrity / engine / cross-language / clean-checkout / fixture-index / issues / unity；`unity` 当前 `available: false`）。"
      placeholder: |
        docs-integrity
    validations:
      required: true

  - type: textarea
    id: expected-delta
    attributes:
      label: 预期差分
      description: 开工前登记：允许发生什么变化（文件 / 行为 / 计数），以及预期不变的是什么。实验只允许在临时目录 / 分支内产生代码，主干行为预期不变；事后补登则本阶段判据失效（R9）。
      placeholder: |
        允许变化：
        预期不变：主干行为与既有门禁结论不变
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 验收标准
      description: checklist，2–8 条，每条独立可判。关闭判据是得到支持 / 否定 / 证据不足的结论 + 原型去向明确，并写明结论记录在哪（design/decisions/ 条目或证据文件），代码写完不算证据（WORKFLOW.md §六）。
      placeholder: |
        - [ ] 改动前：<未知> → 改动后：<可判定的结论>
        - [ ] 结论记录于：design/engineering/evidence/<文件>.md
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: 明确排除
      description: 本 issue 不做的事。实验代码不得顺手进主干；不做的功能与推迟项写在这里。
      placeholder: |
        - 不做：
        - 推迟到：
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: 回滚
      description: 回滚方式 + 演练结论；spike 用完即弃，回滚就是删除实验目录 / 分支。不可回滚的写明为何。
      placeholder: |
        方式：删除实验目录 / 分支，主干未改动
        演练：
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: 假设
      description: 本实验要检验的假设，写成可被证据否定的一句话；不写假设就无法判定证据不足。
      placeholder: |
        假设：如果 <做法>，则 <预期结果>（可被 <观测指标> 否定）。
    validations:
      required: true

  - type: textarea
    id: decision-criteria
    attributes:
      label: 判定标准
      description: 支持 / 否定 / 证据不足三种结果各是什么样，逐条写；三者缺一，结论就无法被核对。
      placeholder: |
        支持：
        否定：
        证据不足：
    validations:
      required: true

  - type: textarea
    id: prototype-disposition
    attributes:
      label: 原型去向
      description: 删除 / 进正典 / 归档三选一，并写明落点。walking skeleton 是永久代码带回归测试，spike 用完即弃；混用会让实验代码进主干。
      placeholder: |
        去向：删除 / 进正典：design/<文档>.md / 归档：design/archive/<路径>
        理由：
    validations:
      required: true
