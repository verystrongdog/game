name: 任务（Task）
description: 明确且不决定新玩法的交付。约束见 design/engineering/issue-process.md §4。
labels: [type:task, state:needs-triage]
body:
  - type: dropdown
    id: issue-type
    attributes:
      label: 类型
      description: 本表单只对一种类型开放，保持选中即可。这一项渲染出的 `### 类型` 章节是校验器的解析锚点，使网页通道与 CLI 通道产出的正文结构逐字一致（校验器只认正文，不认标签）。
      options:
        - Task
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 这件事解决什么问题、为什么是现在、不做会怎样。triage 时据此判断该不该做；关闭时据此判断是否真的解决了那个问题，而不是只看代码写完。
      placeholder: |
        问题：
        为什么是现在：
        不做会怎样：
    validations:
      required: true

  - type: textarea
    id: capability-delta
    attributes:
      label: 能力增量
      description: markdown 表格，三列：能力 | 轴 | 从 → 到。轴只能取 Design / Implementation / Integration / Health，状态只用 WORKFLOW.md §二 各轴的合法取值；能力名逐字取自 design/slices/<id>/slice.md §二。≤ 3 行、≤ 4 个单元格（A1 / I12）。
      placeholder: |
        | 能力 | 轴 | 从 → 到 |
        |---|---|---|
        | Core → Unity 适配层 | Implementation | `FAKE` → `PARTIAL` |
        | Core → Unity 适配层 | Integration | `ISOLATED` → `CONNECTED` |
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖
      description: "三行 key: value，缺一不可。blocked-by 取已关闭的 `#NN`（逗号分隔）或 `无`；consumed-by 取 `#NN` / `<切片 id>` / `证据:<路径>` / `门禁:<gate id>` / `待建:<描述>` / `终态`；requires 取 `gate:<gate id>` / `PLAYABLE:<状态>` / `能力:<能力名>=<轴>:<状态>` / `owner:<决策项>`，或 `无`。取值域见 issue-process.md §4.1.1，不得自造。"
      placeholder: |
        blocked-by: #12, #15
        consumed-by: #20
        requires: gate:engine
    validations:
      required: true

  - type: textarea
    id: gates
    attributes:
      label: 门禁
      description: "将跑的 gate id 或脚本命令，一行一条；gate id 必须存在于 design/engineering/gates.json，可选 docs-integrity / engine / cross-language / clean-checkout / fixture-index / issues / unity。注意 `unity` 当前 `available: false`（本环境无 Unity Editor）——声明它即不得标 state:ready-for-agent（I6 / R8）。"
      placeholder: |
        docs-integrity
        engine
    validations:
      required: true

  - type: textarea
    id: expected-delta
    attributes:
      label: 预期差分
      description: 开工前登记：允许发生什么变化（文件 / 行为 / 计数），以及预期不变的是什么。退出时按 new_finding = after − mapped(before) − expected_delta 计算；事后补登则本阶段判据失效（R9）。
      placeholder: |
        允许变化：
        预期不变：
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 验收标准
      description: checklist，2–8 条，每条独立可判，并写明改动前的状态。代码写完 / 文档写完 / CI 表面绿色都不能单独作为关闭证据（WORKFLOW.md §六）。
      placeholder: |
        - [ ] 改动前：（当前状态）→ 改动后：（可判定结果）
        - [ ] 改动前：（当前状态）→ 改动后：（可判定结果）
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: 明确排除
      description: 本 issue 不做的事，含推迟清单里的相关条目；triage 与评审时据此防 scope 膨胀。
      placeholder: |
        - 不做：
        - 推迟到：
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: 回滚
      description: 回滚方式 + 演练结论；不可回滚的（数据迁移、大范围改名、删除）写明为何，并按 A4 单独成 issue。
      placeholder: |
        方式：git revert <本 issue 的提交组>
        演练：临时 worktree 中验证可恢复上一状态
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: 交付物
      description: 本 issue 实际产出的东西（文件 / 脚本 / 文档 / 决策条目）；关闭判据要求交付物存在。
      placeholder: |
        - code/tools/<脚本>.py：
        - design/<文档>.md §<节>：
    validations:
      required: true

  - type: textarea
    id: integration-point
    attributes:
      label: 接入位置
      description: 产物接进哪个具体位置（哪个 build / 场景 / 调用点 / 消费方），不是写完了。关闭判据要求交付物接入目标位置。
      placeholder: |
        接进：<哪个模块 / 场景 / 调用点>
        被谁消费：<具名消费方>
    validations:
      required: true
