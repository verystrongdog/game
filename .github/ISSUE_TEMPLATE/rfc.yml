name: 提案（RFC）
description: 跨系统、难回滚的决定。约束见 design/engineering/issue-process.md §4。
labels: [type:rfc, state:needs-triage]
body:
  - type: dropdown
    id: issue-type
    attributes:
      label: 类型
      description: 本表单只对一种类型开放，保持选中即可。这一项渲染出的 `### 类型` 章节是校验器的解析锚点，使网页通道与 CLI 通道产出的正文结构逐字一致（校验器只认正文，不认标签）。
      options:
        - RFC
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 这件事解决什么问题、为什么是现在、不做会怎样。写清为什么它不能靠一条 Task / Implementation 解决——跨了哪些系统、为什么难回滚。
      placeholder: |
        问题：
        为什么是现在：
        不做会怎样：
        为什么需要 owner 决策：
    validations:
      required: true

  - type: textarea
    id: capability-delta
    attributes:
      label: 能力增量
      description: markdown 表格，三列：能力 | 轴 | 从 → 到。轴只能取 Design / Implementation / Integration / Health，状态只用 WORKFLOW.md §二 各轴的合法取值；能力名逐字取自 design/slices/<id>/slice.md §二。RFC 典型落 Design 轴 `CANDIDATE` → `ACCEPTED`。≤ 3 行、≤ 4 个单元格（A1 / I12）。
      placeholder: |
        | 能力 | 轴 | 从 → 到 |
        |---|---|---|
        | 结束条件 | Design | `UNRESOLVED` → `ACCEPTED` |
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖
      description: "三行 key: value，缺一不可。blocked-by 取已关闭的 `#NN`（逗号分隔）或 `无`；consumed-by 取 `#NN` / `<切片 id>` / `证据:<路径>` / `门禁:<gate id>` / `待建:<描述>` / `终态`；requires 取 `gate:<gate id>` / `PLAYABLE:<状态>` / `能力:<能力名>=<轴>:<状态>` / `owner:<决策项>`，或 `无`。取值域见 issue-process.md §4.1.1，不得自造。"
      placeholder: |
        blocked-by: 无
        consumed-by: #30
        requires: owner:切片准入决策
    validations:
      required: true

  - type: textarea
    id: gates
    attributes:
      label: 门禁
      description: "RFC 的判据是决策完成而不是机器门禁，无门禁时写 `none`（仅 RFC / Experiment 允许，I12）；此时验收标准必须写明谁在何处记录该决策。若有可跑的既有 gate，一行一条地列出，gate id 必须存在于 design/engineering/gates.json（docs-integrity / engine / cross-language / clean-checkout / fixture-index / issues / unity；`unity` 在本机可用、CI 侧不可用）。"
      placeholder: |
        docs-integrity
    validations:
      required: true

  - type: textarea
    id: expected-delta
    attributes:
      label: 预期差分
      description: 开工前登记：允许发生什么变化（文件 / 行为 / 计数），以及预期不变的是什么。RFC 阶段只允许设计面变化，代码与门禁结论预期不变；事后补登则本阶段判据失效（R9）。
      placeholder: |
        允许变化：design/ 下的决策文档
        预期不变：代码行为、门禁结论、PLAYABLE.md 准入状态
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 验收标准
      description: checklist，2–8 条，每条独立可判。关闭判据要求真实选项、代价、回滚与 owner 决策完成，且必要实施工作已建立（WORKFLOW.md §六）。
      placeholder: |
        - [ ] 改动前：<无该决策> → 改动后：<决策条目存在于 design/decisions/>
        - [ ] 决策记录于：design/decisions/<条目>（谁在何处记录）
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: 明确排除
      description: 本 issue 不做的事，含推迟清单里的相关条目；实施工作不在本 RFC 内做，另开 issue。
      placeholder: |
        - 不做：
        - 另开 issue：
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: 回滚
      description: 回滚方式 + 演练结论。难回滚正是 RFC 的入选理由，因此这里要写清决定被撤销时怎么恢复（决策条目标注 SUPERSEDED / 数据迁移的反向路径 / 为何不可回滚）。
      placeholder: |
        方式：决策条目标注 `SUPERSEDED` 并恢复上一状态
        演练：
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 选项
      description: ≥ 2 个真实选项，每个含代价与不做的后果；只有一个选项说明还没讨论到可以决策（RFC 关闭判据要求真实选项与代价）。
      placeholder: |
        选项 A：<做法> / 代价： / 不做的后果：
        选项 B：<做法> / 代价： / 不做的后果：
    validations:
      required: true

  - type: textarea
    id: owner-decision
    attributes:
      label: owner 决策
      description: 待决 / 已决 + 结论 + 落点。未决期间本 issue 不得开工实施（issue-process.md §2.2：有未决问题不得导入 Task / Implementation）。
      placeholder: |
        状态：待决 / 已决
        结论：
        记录于：design/decisions/<条目>
    validations:
      required: true
