function meshFromData(vertsArr, facesArr, mat, colorsArr, cOff){
  var geo=new THREE.BufferGeometry();

  geo.setIndex(facesArr);

    var cSlice=colorsArr.slice(cOff||0, (cOff||0)+vertsArr.length);
    geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(cSlice),3));
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}

function bezier3(a,b,c,t){
  var u=1-t;
  return new THREE.Vector3(u*u*a.x+2*u*t*b.x+t*t*c.x, u*u*a.y+2*u*t*b.y+t*t*c.y, u*u*a.z+2*u*t*b.z+t*t*c.z);
}
function addTract(from,to,colorHex,unlocked){
  var mid=new THREE.Vector3().addVectors(from,to).multiplyScalar(0.5);
  var dir=new THREE.Vector3().subVectors(to,from).normalize();
  var perp=new THREE.Vector3(-dir.z,0,dir.x).normalize();
  mid.add(perp.multiplyScalar(0.12)); // curvature for tract-like look

  var pts=[];
  for(var i=0;i<=20;i++){pts.push(bezier3(from,mid,to,i/20));}

  if(unlocked){
    var curve=new THREE.CatmullRomCurve3(pts);
    var tubeGeo=new THREE.TubeGeometry(curve,16,0.004,6,false);
    var tubeMat=new THREE.MeshPhongMaterial({color:colorHex,emissive:colorHex,emissiveIntensity:0.4,transparent:true,opacity:0.5,depthWrite:false});
    G.add(new THREE.Mesh(tubeGeo,tubeMat));
  }else{
    var lineGeo=new THREE.BufferGeometry().setFromPoints(pts);
    var lineMat=new THREE.LineDashedMaterial({color:0x334455,transparent:true,opacity:0.18,dashSize:0.12,gapSize:0.10,depthWrite:false});
    var line=new THREE.Line(lineGeo,lineMat);
    line.computeLineDistances();
    G.add(line);
  }
}

function addNode(nd){

  else if(nd.branch==='emo') geo=gEmo;
  else if(nd.branch==='beh') geo=gBeh;
  else geo=gUlt;

  var m;
  if(state.unlocked[nd.id]){
    if(nd.branch==='cog') m=new THREE.Mesh(geo, (nd.type==='主动')?mCogA:mCog);
    else if(nd.branch==='emo') m=new THREE.Mesh(geo, mEmo);
    else if(nd.branch==='beh') m=new THREE.Mesh(geo, mBeh);
    else m=new THREE.Mesh(geo, mUlt);
    m.material=m.material.clone();
    // fMRI glow sphere
    var glowGeo=new THREE.SphereGeometry(0.12,16,16);
    var glowColor=nd.branch==='cog'?0x664488:(nd.branch==='emo'?0x884422:(nd.branch==='beh'?0x225566:0x886622));
    var glowMat=new THREE.MeshBasicMaterial({color:glowColor,transparent:true,opacity:0.10,depthWrite:false});
    var glow=new THREE.Mesh(glowGeo,glowMat);
    glow.position.set(nd.x,nd.y,nd.z);
    G.add(glow);
    glowSpheres.push({mesh:glow, nodeId:nd.id});
  }else if(state.skillPoints>=costOf(nd.tier)){
    m=new THREE.Mesh(geo, mUnlockable.clone());
  }else{
    m=new THREE.Mesh(geo, mLock.clone());
  }
  m.position.set(nd.x,nd.y,nd.z);
  m.userData={nd:nd};
  G.add(m);
  nodes.push({mesh:m, data:nd});
  return m;
}

  document.getElementById('pd').textContent=nd.desc||'';
  document.getElementById('ps').innerHTML=
    '<div><b>AP</b> <i>'+(nd.ap||'—')+'</i></div>'+
    '<div><b>冷却</b> <i>'+(nd.cd||'—')+'</i></div>'+
    '<div><b>成本</b> <i>'+ct+'点</i></div>'+
    '<div><b>层级</b> <i>'+(nd.tier||'—')+'</i></div>';
  document.getElementById('pr').textContent='脑区: '+(nd.region||'—');
  document.getElementById('pp').textContent='坐标: ('+nd.x.toFixed(2)+', '+nd.y.toFixed(2)+', '+nd.z.toFixed(2)+')';
  var btn=document.getElementById('pnl-btn');
  if(state.unlocked[nd.id]){
    btn.textContent='✓ 已解锁'; btn.className='btn lock'; btn.onclick=null;
  }else if(state.skillPoints>=ct){
    btn.textContent='解锁 ('+ct+' 点)'; btn.className='btn';
    btn.onclick=function(){unlockNode(nd.id);};
  }else{
    btn.textContent='技能点不足 (需'+ct+')'; btn.className='btn lock'; btn.onclick=null;
  }
  pnl.classList.add('on');
}

function unlockNode(id){
  var nd=nodeMap[id]; if(!nd)return;
  var ct=nd.tier==='U'?10:costOf(nd.tier);
  if(state.unlocked[id]||state.skillPoints<ct)return;
  state.skillPoints-=ct; state.unlocked[id]=true;
  document.getElementById('sp-val').textContent=state.skillPoints;
  // Add glow
  var glowGeo=new THREE.SphereGeometry(0.12,16,16);
  var glowColor=nd.branch==='cog'?0x664488:(nd.branch==='emo'?0x884422:(nd.branch==='beh'?0x225566:0x886622));
  var glowMat=new THREE.MeshBasicMaterial({color:glowColor,transparent:true,opacity:0.10,depthWrite:false});
  var glow=new THREE.Mesh(glowGeo,glowMat);
  glow.position.set(nd.x,nd.y,nd.z); G.add(glow);
  glowSpheres.push({mesh:glow, nodeId:nd.id});
  refreshNodeMaterials();
  showPanel(nd);
}

// ═══════════════════════════════════════════════════════════
//  INTERACTION
// ═══════════════════════════════════════════════════════════
var raycaster=new THREE.Raycaster(); raycaster.params.Points.threshold=0.15;
var mouse=new THREE.Vector2();
var tip=document.getElementById('tip');
var hovered=null;

document.getElementById('pnl-x').addEventListener('click',function(){
  pnl.classList.remove('on');
  if(selectedMesh){selectedMesh.material.emissiveIntensity=0.5;selectedMesh=null;}
  state.selectedNode=null;
});

function onMove(ev){
  mouse.x=(ev.clientX/window.innerWidth)*2-1;
  mouse.y=-(ev.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,Cam);
  var meshObjs=nodes.map(function(n){return n.mesh;});
  var hits=raycaster.intersectObjects(meshObjs);
  if(hits.length>0){
    var obj=hits[0].object;
    if(hovered!==obj){
      if(hovered&&hovered!==selectedMesh)hovered.material.emissiveIntensity=0.5;
      hovered=obj;
      if(hovered!==selectedMesh)hovered.material.emissiveIntensity=1.3;
    }
    tip.style.display='block'; tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY-24)+'px';
    var hd=obj.userData.nd; tip.textContent=hd.name+(hd.region?' · '+hd.region:'');
    document.body.style.cursor='pointer';
  }else{
    if(hovered&&hovered!==selectedMesh)hovered.material.emissiveIntensity=0.5;
    hovered=null; tip.style.display='none'; document.body.style.cursor='default';
  }
}
function onClick(ev){
  raycaster.setFromCamera(mouse,Cam);
  var meshObjs=nodes.map(function(n){return n.mesh;});
  var hits=raycaster.intersectObjects(meshObjs);
  if(hits.length>0){
    var obj=hits[0].object;
    if(selectedMesh&&selectedMesh!==obj)selectedMesh.material.emissiveIntensity=0.5;
    selectedMesh=obj; selectedMesh.material.emissiveIntensity=1.6;
    state.selectedNode={mesh:obj, data:obj.userData.nd};
    showPanel(obj.userData.nd);
  }
}

window.addEventListener('mousemove',onMove);
window.addEventListener('click',onClick);
window.addEventListener('keydown',function(e){
  switch(e.key.toLowerCase()){
    case'r':Cam.position.set(3.5,2.8,3.2);ctrl.target.set(0,0.55,0);break;
    case'f':Cam.position.set(0,2,4.5);ctrl.target.set(0,0.55,0);break;
    case't':Cam.position.set(0,3.5,0.5);ctrl.target.set(0,0.55,0);break;
    case'u':if(state.selectedNode&&state.selectedNode.data){var nd=state.selectedNode.data;if(!state.unlocked[nd.id])unlockNode(nd.id);}break;
  }
  ctrl.update();
});
window.addEventListener('resize',function(){
  Cam.aspect=window.innerWidth/window.innerHeight;Cam.updateProjectionMatrix();
  R.setSize(window.innerWidth,window.innerHeight);
});

// ═══════════════════════════════════════════════════════════
//  ANIMATION
// ═══════════════════════════════════════════════════════════
renderSlots();
document.getElementById('sp-val').textContent=state.skillPoints;

var totalNodes=treeData.cognition.length+treeData.emotion.length+treeData.behavior.length+treeData.ultimate.length;
console.log('🧠 大脑技能树: '+totalNodes+'节点 (认知:'+treeData.cognition.length+' 情绪:'+treeData.emotion.length+' 行为:'+treeData.behavior.length+' 终极:'+treeData.ultimate.length+')');
console.log('   前置连线: '+prereqPairs.length+'条 | 快捷槽: 6个 | 技能点: '+state.skillPoints);

var clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var t=clock.getElapsedTime();
  // Subtle pulse for unlocked nodes
  for(var i=0;i<nodes.length;i++){
    if(state.unlocked[nodes[i].data.id]){
      var s=1+Math.sin(t*2.0+nodes[i].data.x*3+nodes[i].data.y*4)*0.05;
      nodes[i].mesh.scale.setScalar(s);
    }
  }
  // Pulsing glow for unlockable nodes
  for(var n=0;n<nodes.length;n++){
    if(!state.unlocked[nodes[n].data.id]&&state.skillPoints>=costOf(nodes[n].data.tier)){
      var pulse=0.5+Math.sin(t*3.0+n)*0.15;
      nodes[n].mesh.material.opacity=pulse;
    }
  }
  // Subtle ambient motion
  // Subtle hemisphere rotation (meshes are inside brainGroup, transforms compose correctly)
	  leftHemi.rotation.y+=0.00005; rightHemi.rotation.y-=0.00005;
  stars.rotation.y+=0.0002;
  ctrl.update();
  R.render(S,Cam);
}
animate();

})();
</script>
</body>
</html>
