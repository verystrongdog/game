<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Three.js Test</title>
<style>body{margin:0;background:#0d0d12;overflow:hidden}</style>
</head>
<body>
<div id="msg" style="position:fixed;top:10px;left:10px;color:#fff;font:14px monospace;z-index:10;">Loading...</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
var msg = document.getElementById('msg');
try {
  msg.textContent = 'THREE loaded: ' + (typeof THREE !== 'undefined');

  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color('#0d0d12');

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 50);
  camera.position.set(3, 2, 5);
  camera.lookAt(0, 0, 0);

  // Test: a glowing cube at origin
  var geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  var mat = new THREE.MeshStandardMaterial({ color: '#6b7fff', emissive: '#b388ff', emissiveIntensity: 0.5, roughness: 0.3 });
  var cube = new THREE.Mesh(geo, mat);
  scene.add(cube);

  // Test: some spheres
  for (var i = 0; i < 10; i++) {
    var s = new THREE.Mesh(
      new THREE.SphereGeometry(0.1, 16, 16),
      new THREE.MeshStandardMaterial({ color: '#f0a060', emissive: '#ffcc88', emissiveIntensity: 0.5, roughness: 0.3 })
    );
    s.position.set(Math.cos(i*0.8)*1.5, i*0.3, Math.sin(i*0.8)*1.5);
    scene.add(s);
  }

  // Lights
  scene.add(new THREE.AmbientLight('#334466', 1.5));
  var light = new THREE.DirectionalLight('#ffffff', 2);
  light.position.set(5, 8, 3);
  scene.add(light);

  // OrbitControls
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1, 0);
  controls.update();

  // Starfield
  var starsGeo = new THREE.BufferGeometry();
  var starsPos = new Float32Array(600 * 3);
  for (var i = 0; i < 600; i++) {
    starsPos[i*3] = (Math.random() - 0.5) * 20;
    starsPos[i*3+1] = (Math.random() - 0.5) * 20;
    starsPos[i*3+2] = (Math.random() - 0.5) * 20;
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
  scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: '#556688', size: 0.02 })));

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.02;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  msg.textContent = 'OK - rotating cube + 10 spheres + stars. Drag to rotate, scroll to zoom.';
  msg.style.color = '#0f0';

} catch(e) {
  msg.textContent = 'ERROR: ' + (e.stack || e.message || e);
  msg.style.color = '#f00';
  msg.style.fontSize = '18px';
  msg.style.whiteSpace = 'pre-wrap';
}
</script>
</body>
</html>
