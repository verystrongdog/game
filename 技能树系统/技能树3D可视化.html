<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;font-family:'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden;height:100vh;user-select:none}
#c{display:block;position:fixed;top:0;left:0;width:100%;height:100%}

/* ── Top bar ── */
#top{position:fixed;top:12px;left:20px;z-index:10;pointer-events:none;color:#e0e0f0}
#top h1{font-size:1.05rem;font-weight:500;letter-spacing:0.04em}
#top p{font-size:0.6rem;color:#8888a0;margin-top:2px}

/* ── Legend ── */
#leg{position:fixed;top:12px;right:20px;z-index:10;display:flex;gap:10px;color:#8888a0;font-size:0.58rem;flex-wrap:wrap;max-width:320px;justify-content:flex-end}
#leg span{display:flex;align-items:center;gap:4px;white-space:nowrap}
#leg i{display:inline-block;width:7px;height:7px;border-radius:50%}

/* ── Skill points ── */
#sp{position:fixed;top:44px;left:20px;z-index:10;color:#e8d070;font-size:0.78rem;font-weight:600;letter-spacing:0.02em}

/* ── Info panel ── */
#pnl{position:fixed;right:14px;top:50%;transform:translateY(-50%);width:250px;max-height:58vh;overflow-y:auto;background:rgba(10,10,22,0.95);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:14px;z-index:10;display:none;font-size:0.68rem;color:#ccc}
#pnl.on{display:block}
#pnl h3{margin:0 0 2px;font-size:0.9rem}
#pnl .meta{font-size:0.58rem;color:#888;margin-bottom:5px}
#pnl .tags{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
#pnl .tags em{font-size:0.55rem;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);font-style:normal}
#pnl .desc{line-height:1.45;margin-bottom:6px;color:#bbb}
#pnl .stat{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;font-size:0.62rem}
#pnl .stat b{color:#999;font-weight:400}
#pnl .stat i{color:#ddd;font-style:normal}
#pnl .pre{font-size:0.58rem;color:#777;margin-top:5px}
#pnl .x{position:absolute;top:5px;right:7px;background:none;border:none;color:#666;cursor:pointer;font-size:0.9rem}
#pnl .btn{display:block;width:100%;margin-top:8px;padding:5px 0;border-radius:5px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#ccc;cursor:pointer;font-size:0.65rem;text-align:center;letter-spacing:0.03em}
#pnl .btn:hover{background:rgba(255,255,255,0.08)}
#pnl .btn.lock{color:#555;cursor:not-allowed;border-color:rgba(255,255,255,0.04)}
#pnl .btn.lock:hover{background:rgba(255,255,255,0.02)}

#slots{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;background:rgba(10,10,20,0.9);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:8px 14px}
.slot{width:44px;height:44px;border-radius:8px;border:1px dashed rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;position:relative}
.slot:hover{border-color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.04)}
.slot.filled{border-style:solid;border-color:rgba(255,255,255,0.2)}
.slot .name{font-size:0.55rem;color:#aaa;text-align:center;line-height:1.1}
.slot .ap{position:absolute;bottom:2px;right:4px;font-size:0.45rem;color:#777}

/* ── Bottom hint ── */

// ── Helpers ──
function bezier(a,b,c,t){
  var u=1-t;
  return new THREE.Vector3(u*u*a.x+2*u*t*b.x+t*t*c.x, u*u*a.y+2*u*t*b.y+t*t*c.y, u*u*a.z+2*u*t*b.z+t*t*c.z);
}
function addCyl(from,to,colorHex,r){
  var d=new THREE.Vector3().subVectors(to,from); var len=d.length();
  if(len<0.001)return;
  var mid2=new THREE.Vector3().addVectors(from,to).multiplyScalar(0.5);
  var cg=new THREE.CylinderGeometry(r||0.015,r||0.015,len,6);
  var cm=new THREE.MeshPhongMaterial({color:colorHex,emissive:colorHex,emissiveIntensity:0.25,specular:0x222233,shininess:30,transparent:true,opacity:0.5});
  var cmesh=new THREE.Mesh(cg,cm);
  cmesh.position.copy(mid2);
  cmesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  G.add(cmesh);
}
function branch(from,to,colorHex,thickness){
  var mid=new THREE.Vector3().addVectors(from,to).multiplyScalar(0.5);
  var dir=new THREE.Vector3().subVectors(to,from).normalize();
  var perp=new THREE.Vector3(-dir.z,0,dir.x).normalize();
  mid.add(perp.multiplyScalar(0.2));
  var steps=14;
  for(var i=0;i<steps;i++){
    var t0=i/steps,t1=(i+1)/steps;
    addCyl(bezier(from,mid,to,t0),bezier(from,mid,to,t1),colorHex,thickness||0.025);
  }
}

// Dot-dash line for prerequisites
var dashMat=new THREE.LineDashedMaterial({color:0x556688,transparent:true,opacity:0.35,dashSize:0.2,gapSize:0.15});
function addDashLine(a,b){
  var g=new THREE.BufferGeometry().setFromPoints([a,b]);
  var l=new THREE.Line(g,dashMat);
  l.computeLineDistances();
  G.add(l);
}

// ── Add node function ──
function addNode(id,name,branch,tier,pos,info){
  var geo;
  if(branch==='cog') geo=gCog;
  else if(branch==='emo') geo=gEmo;
  else if(branch==='beh') geo=gBeh;
  else geo=gUlt;

  var m; var useMat;
  if(state.unlocked[id]){
    if(branch==='cog') useMat=(info.type==='主动')?mCogActive:mCog;
    else if(branch==='emo') useMat=mEmo;
    else if(branch==='beh') useMat=mBehActive;
    else useMat=mUlt;
    m=new THREE.Mesh(geo,useMat.clone());
  }else{
    m=new THREE.Mesh(geo,mLock.clone());
    // Check if unlockable
    if(state.skillPoints>=costOf(tier)){
      m.material=mUnlockable.clone();
    }
  }
  m.position.copy(pos);
  m.userData={nd:{id:id,name:name,branch:branch,tier:tier,pos:pos.toArray(),info:info}};
  G.add(m);
  nodes.push({mesh:m, data:m.userData.nd});
  return m;
}

// ── COGNITION: 5 tiered sub-branches ──
for(var t=0;t<5;t++){
  var frac=(t+0.5)/5.5;
  var branchPt=new THREE.Vector3().lerpVectors(O,cogTop,frac);
  var angle=t*0.7+0.3;
  var subLen=1.0+t*0.3;
  var subDir=new THREE.Vector3(Math.cos(angle)*subLen*0.5, 0.2, Math.sin(angle)*subLen*0.5);
  var subEnd=branchPt.clone().add(subDir);
  branch(branchPt,subEnd,0x5566aa,0.025);

  for(var i=0;i<5;i++){
    var nf=(i+0.5)/5.5;
    var npos=new THREE.Vector3().lerpVectors(branchPt,subEnd,nf);
    npos.x+=(i-2)*0.12; npos.z+=(i-2)*0.08;
    var nd=treeData.cognition[t*5+i];
    addNode(nd.id,nd.name,'cog',nd.tier,npos,nd);
  }
}

// ── EMOTION: PAD-mapped around trunk ──
for(var e=0;e<treeData.emotion.length;e++){
  var ed=treeData.emotion[e];
  var frac=(ed.tier-0.3)/5.5;
  var trunkPt=new THREE.Vector3().lerpVectors(O,emoTop,frac);
  var px=trunkPt.x+ed.D*0.8;
  var py=trunkPt.y+ed.V*0.5;
  var pz=trunkPt.z+ed.A*0.6;
  var pos=new THREE.Vector3(px,py,pz);
  addCyl(trunkPt,pos,0x996644,0.012);
  addNode(ed.id,ed.name,'emo',ed.tier,pos,ed);
}

// ── BEHAVIOR: 7 drive sub-branches ──
for(var d=0;d<7;d++){
  var driveTiers=[1,2,2,3,3,4,4];
  var tier=driveTiers[d];
  var frac=(d+0.5)/7.5;
  var branchPt=new THREE.Vector3().lerpVectors(O,behTop,frac);
  var angle=(d-3)*0.35;
  var subLen=0.8+tier*0.3;
  var subDir=new THREE.Vector3(Math.cos(angle)*subLen, 0.15, Math.sin(angle)*subLen*0.7);
  var subEnd=branchPt.clone().add(subDir);
  branch(branchPt,subEnd,0x336688,0.025);

  for(var i=0;i<3;i++){
    var nf=(i+0.5)/3.5;
    var npos=new THREE.Vector3().lerpVectors(branchPt,subEnd,nf);
    npos.y+=(i-1)*0.1;
    var nd=treeData.behavior[d*3+i];
    addNode(nd.id,nd.name,'beh',nd.tier,npos,nd);
  }
}

var slotsEl=document.getElementById('slots');
var slotDivs=[];
for(var s=0;s<6;s++){
  var div=document.createElement('div');
  div.className='slot';
  div.title='快捷槽 '+(s+1);
  div.addEventListener('click',(function(i){return function(){onSlotClick(i);};})(s));
  slotsEl.appendChild(div);
  slotDivs.push(div);
}
function renderSlots(){
  for(var i=0;i<6;i++){
    var ndId=state.quickSlots[i];
    var div=slotDivs[i];
    div.className='slot';
    if(ndId){
      div.classList.add('filled');
      var nd=findNodeData(ndId);
      if(nd){
        var b=nd.branch||'';
        if(b==='cog')div.classList.add('cog-slot');
        else if(b==='emo')div.classList.add('emo-slot');
        else if(b==='beh')div.classList.add('beh-slot');
        div.innerHTML='<span class="name">'+nd.name+'</span><span class="ap">'+(nd.info.ap||'')+'</span>';
      }
    }else{
      div.innerHTML='<span style="color:#444;font-size:0.8rem">+</span>';
    }
  }
}
function findNodeData(id){
  for(var n=0;n<nodes.length;n++){if(nodes[n].data.id===id) return nodes[n].data;}
  // also check treeData for non-rendered
  var all=[].concat(treeData.cognition,treeData.emotion,treeData.behavior,treeData.ultimate);
  for(var a=0;a<all.length;a++){if(all[a].id===id) return all[a];}
  return null;
}
function onSlotClick(i){
  if(state.quickSlots[i]){
    // Remove from slot
    state.quickSlots[i]=null;
  }else if(state.selectedNode){
    var ndId=state.selectedNode.data.id;
    // Don't add if already in a slot
    if(state.quickSlots.indexOf(ndId)>=0) return;
    // Add to slot
    state.quickSlots[i]=ndId;
  }
  renderSlots();
}

var pnl=document.getElementById('pnl');
var selectedMesh=null;

function refreshNodeMaterials(){
  for(var n=0;n<nodes.length;n++){
    var nd=nodes[n].data;
    var m=nodes[n].mesh;
    if(state.unlocked[nd.id]){
      if(nd.branch==='cog') m.material=(nd.info.type==='主动')?mCogActive:mCog;
      else if(nd.branch==='emo') m.material=mEmo;
      else if(nd.branch==='beh') m.material=mBehActive;
      else m.material=mUlt;
      m.material=m.material.clone();
    }else if(state.skillPoints>=costOf(nd.tier)){
      m.material=mUnlockable.clone();
    }else{
      m.material=mLock.clone();
    }
    m.material.needsUpdate=true;
  }
}

function showPanel(nd,info){
  var b=nd.branch;
  var bName=b==='cog'?'认知':(b==='emo'?'情绪':(b==='beh'?'行为':'终极技能'));
  var bColor=b==='cog'?'#a0b0ff':(b==='emo'?'#ffb878':(b==='beh'?'#80d8ff':'#ffe888'));
  document.getElementById('pn').textContent=nd.name;
  document.getElementById('pn').style.color=bColor;
  var typeStr=(info.type||'')+(nd.tier==='U'?'':(' · L'+nd.tier));
  document.getElementById('pm').textContent=bName+' · '+typeStr;

  var t='';
  if(info.mod) t+='<em>'+info.mod+'</em>';
  if(info.drive) t+='<em>'+info.drive+'</em>';
  if(info.combo) t+='<em>'+info.combo+'</em>';
  if(info.V!==undefined) t+='<em>V:'+info.V.toFixed(1)+' D:'+info.D.toFixed(1)+'</em>';
  var ct=nd.tier==='U'?10:costOf(nd.tier);
  t+='<em>'+ct+'点</em>';
  document.getElementById('pt').innerHTML=t;
  document.getElementById('pd').textContent=info.desc||'';

  var apVal=info.ap||'—';
  var cdVal=info.cd||'—';
  document.getElementById('ps').innerHTML=
    '<div><b>AP</b> <i>'+apVal+'</i></div>'+
    '<div><b>冷却</b> <i>'+cdVal+'</i></div>'+
    '<div><b>类型</b> <i>'+(info.type||'—')+'</i></div>'+
    '<div><b>层级</b> <i>'+(nd.tier||'—')+'</i></div>';

  document.getElementById('pp').textContent='成本: '+ct+' 技能点';

  // Unlock button
  var btn=document.getElementById('pnl-btn');
  if(state.unlocked[nd.id]){
    btn.textContent='✓ 已解锁';
    btn.className='btn lock';
  }else if(state.skillPoints>=ct){
    btn.textContent='解锁 ('+ct+' 点)';
    btn.className='btn';
    btn.onclick=function(){unlockNode(nd.id);};
  }else{
    btn.textContent='技能点不足 (需'+ct+')';
    btn.className='btn lock';
    btn.onclick=null;
  }

  pnl.classList.add('on');
}

function unlockNode(id){
  var nd=findNodeData(id);
  if(!nd)return;
  var ct=nd.tier==='U'?10:costOf(nd.tier);
  if(state.unlocked[id])return;
  if(state.skillPoints<ct)return;
  state.skillPoints-=ct;
  state.unlocked[id]=true;
  document.getElementById('sp-val').textContent=state.skillPoints;
  refreshNodeMaterials();
  showPanel(nd, nd.info||nd);
}

var raycaster=new THREE.Raycaster();
var mouse=new THREE.Vector2();
var tip=document.getElementById('tip');
var hovered=null;

document.getElementById('pnl-x').addEventListener('click',function(){
  pnl.classList.remove('on');
  if(selectedMesh){
    selectedMesh.material.emissiveIntensity=0.4;
    selectedMesh=null;
  }
  state.selectedNode=null;
});

function onMove(ev){
  mouse.x=(ev.clientX/window.innerWidth)*2-1;
  mouse.y=-(ev.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,Cam);
  var meshObjs=nodes.map(function(n){return n.mesh;});
  var hits=raycaster.intersectObjects(meshObjs);
  if(hits.length>0){
    var obj=hits[0].object;
    if(hovered!==obj){
      if(hovered&&hovered!==selectedMesh) hovered.material.emissiveIntensity=0.4;
      hovered=obj;
      if(hovered!==selectedMesh) hovered.material.emissiveIntensity=1.2;
    }
    tip.style.display='block';
    tip.style.left=(ev.clientX+16)+'px';
    tip.style.top=(ev.clientY-28)+'px';
    tip.textContent=obj.userData.nd.name;
    document.body.style.cursor='pointer';
  }else{
    if(hovered&&hovered!==selectedMesh) hovered.material.emissiveIntensity=0.4;
    hovered=null; tip.style.display='none'; document.body.style.cursor='default';
  }
}
function onClick(ev){
  raycaster.setFromCamera(mouse,Cam);
  var meshObjs=nodes.map(function(n){return n.mesh;});
  var hits=raycaster.intersectObjects(meshObjs);
  if(hits.length>0){
    var obj=hits[0].object;
    if(selectedMesh&&selectedMesh!==obj) selectedMesh.material.emissiveIntensity=0.4;
    selectedMesh=obj; selectedMesh.material.emissiveIntensity=1.5;
    state.selectedNode={mesh:obj, data:obj.userData.nd};
    showPanel(obj.userData.nd, obj.userData.nd.info);
  }
}
window.addEventListener('mousemove',onMove);
window.addEventListener('click',onClick);

window.addEventListener('keydown',function(e){
  switch(e.key.toLowerCase()){
    case'r':Cam.position.set(7,4.5,10);ctrl.target.set(0,3,0);break;
    case'f':Cam.position.set(0,4,9);ctrl.target.set(0,3,0);break;
    case't':Cam.position.set(0,9,1);ctrl.target.set(0,3,0);break;
    case'1':ctrl.target.set(-2.5,3,-1.5);break;
    case'2':ctrl.target.set(0,3,2);break;
    case'3':ctrl.target.set(2.5,3,-0.6);break;

        var nd=state.selectedNode.data;
        if(!state.unlocked[nd.id]) unlockNode(nd.id);
      }
      break;
  }
  ctrl.update();
});

  requestAnimationFrame(animate);
  var t=clock.getElapsedTime();
  // Subtle node pulsing for unlocked nodes
  for(var i=0;i<nodes.length;i++){
    var nd=nodes[i].data;
    if(state.unlocked[nd.id]){
      var s=1+Math.sin(t*1.8+nd.pos[0]*2+nd.pos[1]*3)*0.04;
      nodes[i].mesh.scale.setScalar(s);
    }
  }
  // Root rings
  var rings=G.children.filter(function(c){return c.geometry&&(c.geometry.type==='TorusGeometry'||c.geometry.type==='TorusBufferGeometry');});
  for(var ri=0;ri<Math.min(3,rings.length);ri++){
    rings[ri].rotation.z+=0.002*(ri+1);
    rings[ri].scale.setScalar(1+Math.sin(t*0.7+ri)*0.06);
  }
  stars.rotation.y+=0.00025;
  ctrl.update();
  R.render(S,Cam);
}
animate();

})();
</script>
</body>
</html>
