<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>态度系统 — 90种态度 行为输出空间 (Frijda + RST)</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.35.2/plotly.min.js"></script>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d38;--text:#e1e4ed;--muted:#8b8fa3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
header h1{font-size:1.2rem;font-weight:700}
header .src{color:var(--muted);font-size:0.72rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:0.7rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend .sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}
#plot3d{flex:1;min-height:650px}
</style>
</head>
<body>

<header>
  <div>
    <h1>90 种态度 — 行为输出空间</h1>
    <div class="src">
      7 驱动 (含照护) &nbsp;|&nbsp;
      B_raw = (P, |A|, D) ← Frijda + NRC VAD &nbsp;|&nbsp;
      驱动向量 ← RST + 催产素-多巴胺通路 (照护) &nbsp;|&nbsp;
      自然 0.8/0.2 &nbsp; 硬解锁 0.3/0.7 &nbsp; 情境 0.5/0.5 &nbsp;|&nbsp;
      拖动旋转/缩放 悬停看详情
    </div>
  </div>
  <div class="legend" id="legendDyn"></div>
</header>
<div id="plot3d"></div>

<script>
// ═══════════════════════════════════════════════════
// EMPIRICAL DATA
// ═══════════════════════════════════════════════════
const emotions = [
  {name:"快乐",V:0.960,A:0.648,D:0.588},{name:"爱",V:1.000,A:0.038,D:0.346},
  {name:"共情",V:0.458,A:-0.302,D:0.090},{name:"平静",V:0.600,A:-0.756,D:0.114},
  {name:"希望",V:0.854,A:-0.366,D:0.478},{name:"敬畏",V:-0.062,A:0.480,D:-0.400},
  {name:"愤怒",V:-0.666,A:0.730,D:0.314},{name:"恐惧",V:-0.854,A:0.680,D:-0.414},
  {name:"焦虑",V:-0.708,A:0.730,D:-0.316},{name:"厌恶",V:-0.896,A:0.550,D:-0.366},
  {name:"恐怖",V:-0.770,A:0.700,D:-0.124},{name:"绝望",V:-0.770,A:0.588,D:-0.510},
  {name:"内疚",V:-0.584,A:0.134,D:-0.588},{name:"悲痛",V:-0.896,A:-0.424,D:-0.672},
  {name:"孤独",V:-0.500,A:-0.548,D:-0.524},
];
const drives=["反射","惩罚","奖励","道德","文化","价值","照护"];
const dColor={
  "反射":"#ef4444","惩罚":"#f97316","奖励":"#22c55e",
  "道德":"#3b82f6","文化":"#a855f7","价值":"#facc15",
  "照护":"#ec4899",
};

// ═══════════════════════════════════════════════════
// RST-GROUNDED DRIVE VECTORS
// FFFS→反射: pure avoidance, max intensity, zero autonomy
// BIS →惩罚: avoidance, moderate intensity, low autonomy
// BAS →奖励: approach, moderate intensity, some autonomy
// S2  →道德: slight approach (doing right), moderate, high autonomy
// Ext →文化: neutral (follow script), low intensity, neutral autonomy
// S2+ →价值: approach (override), max intensity, max autonomy
// ═══════════════════════════════════════════════════
const drivePole = {
  "反射":{x:-1.0, y:1.0, z:-1.0},  // FFFS — pure avoidance, max intensity, no control
  "惩罚":{x:-0.7, y:0.5, z:-0.5},  // BIS — avoidance, moderate, low control
  "奖励":{x:+1.0, y:0.6, z:+0.3},  // BAS — approach, moderate, some control
  "道德":{x:+0.3, y:0.4, z:+0.8},  // Prefrontal S2 — slight approach, moderate, high autonomy
  "文化":{x: 0.0, y:0.2, z: 0.0},  // External script — neutral, low, neutral
  "价值":{x:+1.0, y:1.0, z:+1.0},  // S2 override — approach, maximum, maximum
  "照护":{x:+1.0, y:0.9, z:+0.7},  // Oxytocin-DA — fast approach, high intensity, active (reads OTHER's PAD)
};

// ═══════════════════════════════════════════════════
// BEHAVIOR OUTPUT MODEL
// natural: B = 0.8·B_raw + 0.2·drive_pole  (emotion leads)
// forced:  B = 0.3·B_raw + 0.7·drive_pole  (willpower overrides)
// ═══════════════════════════════════════════════════
function behaviorOutput(emo, drv, state) {
  const bRaw = {x:emo.V, y:Math.abs(emo.A), z:emo.D};
  const pole = drivePole[drv];
  // Situational drives (文化, 照护): external script or external signal → pole-dominant
  if (state==="situational") {
    const wRaw=0.5, wDrv=0.5;
    return {x: wRaw*bRaw.x + wDrv*pole.x, y: wRaw*bRaw.y + wDrv*pole.y, z: wRaw*bRaw.z + wDrv*pole.z};
  }
  const wRaw = state==="natural" ? 0.8 : 0.3;
  const wDrv = state==="natural" ? 0.2 : 0.7;
  return {
    x: wRaw*bRaw.x + wDrv*pole.x,
    y: wRaw*bRaw.y + wDrv*pole.y,
    z: wRaw*bRaw.z + wDrv*pole.z,
  };
}

function getState(emo, drv) {
  const {V,A,D,name}=emo;
  if(drv==="反射"){if(A>0.5&&D<-0.3)return"natural";return"invalid";}
  if(drv==="惩罚"){if(V<0)return"natural";if(name==="共情")return"forced";if(V>0)return"invalid";return"forced";}
  if(drv==="奖励"){if(V>0)return"natural";return"forced";}
  if(drv==="道德"){if(D>-0.3)return"natural";return"forced";}
  if(drv==="文化"){return"situational";}
  if(drv==="价值"){if(D>0.3)return"natural";return"forced";}
  if(drv==="照护"){
    if(D<-0.7)return"invalid";  // 完全失控时无力照护
    return"situational";         // 情境门控: V_signal × S
  }
  return"invalid";
}

// ═══════════════════════════════════════════════════
// BUILD ATTITUDE POINTS
// ═══════════════════════════════════════════════════
const fmt = v => (v>=0?'+':'')+v.toFixed(2);
const allAttitudes = [];
for (const emo of emotions) {
  for (const drv of drives) {
    const state = getState(emo, drv);
    if (state==="invalid") continue;
    const b = behaviorOutput(emo, drv, state);
    const desc = state==="natural" ? "自然" : "硬解锁·意志力";
    allAttitudes.push({
      emo:emo.name, drv, state, ...b,
      emoV:emo.V, emoA:emo.A, emoD:emo.D,
      label:`${emo.name}+${drv}`, desc,
      bRaw:{x:emo.V, y:Math.abs(emo.A), z:emo.D},
      pole:drivePole[drv],
    });
  }
}

// Raw emotion thrust points
const rawPoints = emotions.map(e=>({name:e.name, x:e.V, y:Math.abs(e.A), z:e.D}));

// ═══════════════════════════════════════════════════
// 3D PLOT
// ═══════════════════════════════════════════════════
const traces3d = [];

// Connection lines: raw emotion → attitude
const lx=[], ly=[], lz=[];
for (const p of allAttitudes) {
  lx.push(p.bRaw.x, p.x, NaN);
  ly.push(p.bRaw.y, p.y, NaN);
  lz.push(p.bRaw.z, p.z, NaN);
}
traces3d.push({
  type:"scatter3d", mode:"lines", x:lx, y:ly, z:lz,
  line:{color:"#374151", width:0.5},
  showlegend:false, hoverinfo:"skip",
});

// Attitude markers by drive × state
for (const drv of drives) {
  for (const state of ["natural","forced","situational"]) {
    const pts = allAttitudes.filter(p=>p.drv===drv && p.state===state);
    if (!pts.length) continue;
    const sym = state==="natural"?"circle":state==="situational"?"square-open":"diamond-open";
    const sz = state==="natural"?7:state==="situational"?6:6;
    const op = state==="natural"?0.95:state==="situational"?0.75:0.65;
    const label = state==="natural"?`${drv}·自然`:state==="situational"?`${drv}·情境`:`${drv}·硬解锁`;
    const name = state==="situational"?`${drv}·情境`:`${drv}·${state==="natural"?"自然":"硬解锁"}`;
    traces3d.push({
      type:"scatter3d", mode:"markers",
      x:pts.map(p=>p.x), y:pts.map(p=>p.y), z:pts.map(p=>p.z),
      marker:{symbol:sym, size:sz, color:dColor[drv], opacity:op,
              line:(state==="forced"||state==="situational")?{width:1.5,color:dColor[drv]}:{width:0}},
      name, legendgroup:drv,
      customdata:pts.map(p=>[
        p.label, p.desc,
        `情绪: V=${fmt(p.emoV)} A=${fmt(p.emoA)} D=${fmt(p.emoD)}`,
        `B_raw=(${fmt(p.bRaw.x)},${fmt(p.bRaw.y)},${fmt(p.bRaw.z)}) → 行为=(${fmt(p.x)},${fmt(p.y)},${fmt(p.z)})`,
      ]),
      hovertemplate:"<b>%{customdata[0]}</b> · %{customdata[1]}<br>%{customdata[2]}<br>%{customdata[3]}<extra></extra>",
    });
  }
}

// Raw emotion thrust  (B_raw)
traces3d.push({
  type:"scatter3d", mode:"markers+text",
  x:rawPoints.map(r=>r.x), y:rawPoints.map(r=>r.y), z:rawPoints.map(r=>r.z),
  marker:{symbol:"circle-open", size:5, color:"#9ca3af", opacity:0.5},
  text:rawPoints.map(r=>r.name), textposition:"top center",
  textfont:{size:9, color:"#6b7280"},
  name:"情绪原始推力 B_raw (Frijda)", showlegend:true,
  hoverinfo:"skip",
});

// Drive poles (RST)
for (const drv of drives) {
  const pole = drivePole[drv];
  traces3d.push({
    type:"scatter3d", mode:"markers+text",
    x:[pole.x], y:[pole.y], z:[pole.z],
    marker:{symbol:"diamond", size:9, color:dColor[drv], opacity:0.8, line:{width:1.5,color:"#0f1117"}},
    text:[drv], textposition:"middle right",
    textfont:{size:10, color:dColor[drv]},
    name:`${drv}极 (RST/S2)`, showlegend:false,
    hoverinfo:"skip",
  });
}

// Origin axes
const ax=1.15;
traces3d.push(
  {type:"scatter3d",mode:"lines",x:[-ax,ax],y:[0,0],z:[0,0],line:{color:"#374151",width:1},showlegend:false,hoverinfo:"skip"},
  {type:"scatter3d",mode:"lines",x:[0,0],y:[-ax,ax],z:[0,0],line:{color:"#374151",width:1},showlegend:false,hoverinfo:"skip"},
  {type:"scatter3d",mode:"lines",x:[0,0],y:[0,0],z:[-ax,ax],line:{color:"#374151",width:1},showlegend:false,hoverinfo:"skip"},
);

Plotly.newPlot("plot3d", traces3d, {
  paper_bgcolor:"transparent", plot_bgcolor:"transparent",
  font:{color:"#e1e4ed",family:"-apple-system,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif",size:11},
  legend:{font:{color:"#9ca3af",size:9},x:0.01,y:0.98,bgcolor:"rgba(0,0,0,0.45)",
          groupclick:"toggleitem",itemdoubleclick:"toggleothers"},
  margin:{l:0,r:0,t:0,b:0},
  scene:{
    xaxis:{title:{text:"← 回避 · · · · · 趋近 →",font:{size:10}},range:[-1.25,1.25],gridcolor:"#1f2937",zerolinecolor:"#374151",color:"#9ca3af"},
    yaxis:{title:{text:"← 低强度 · · · · · 高强度 →",font:{size:10}},range:[-0.1,1.3],gridcolor:"#1f2937",zerolinecolor:"#374151",color:"#9ca3af"},
    zaxis:{title:{text:"← 被动 · · · · · 主动 →",font:{size:10}},range:[-1.25,1.25],gridcolor:"#1f2937",zerolinecolor:"#374151",color:"#9ca3af"},
    bgcolor:"transparent",
    camera:{eye:{x:1.6,y:1.35,z:0.95}},
  },
}, {responsive:true});

// Legend
const leg=document.getElementById("legendDyn");
for(const drv of drives){
  const nN=allAttitudes.filter(p=>p.drv===drv&&p.state==="natural").length;
  const nF=allAttitudes.filter(p=>p.drv===drv&&p.state==="forced").length;
  leg.insertAdjacentHTML("beforeend",`<span><span class="sw" style="background:${dColor[drv]}"></span>${drv}(${nN}+${nF})</span>`);
}
leg.insertAdjacentHTML("beforeend",`<span>●自然 ◇硬解锁 □情境</span><span>○情绪推力</span><span>◆驱动极</span>`);
</script>
</body>
</html>
